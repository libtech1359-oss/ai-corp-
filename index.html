<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Capital | AI投資法人シミュレーション</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --text:    #c9d1d9;
      --muted:   #8b949e;
      --accent:  #4ecca3;
      --blue:    #6c8aff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.6;
    }

    /* ── header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    header h1 { font-size: 1.3rem; color: var(--accent); }
    header p  { font-size: 0.8rem; color: var(--muted); }
    .badge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.2rem 0.75rem;
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── layout ── */
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    .section-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin: 1.5rem 0 0.6rem;
    }

    /* ── agents ── */
    .agents {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.5rem;
    }
    .agent {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.35rem 0.7rem;
      font-size: 0.78rem;
    }

    /* ── card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 0.75rem;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .tag {
      background: var(--accent);
      color: #000;
      border-radius: 4px;
      padding: 0.1rem 0.5rem;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .tag.close   { background: var(--blue); color: #fff; }
    .tag.weekly  { background: #9f7aea;     color: #fff; }
    .card-date { font-size: 0.82rem; color: var(--muted); }

    /* ── markdown ── */
    .md h1 { font-size: 1.15rem; color: var(--accent); margin-bottom: 0.5rem; }
    .md h2 { font-size: 0.95rem; color: var(--blue); margin: 1rem 0 0.35rem;
             border-bottom: 1px solid var(--border); padding-bottom: 0.25rem; }
    .md p  { font-size: 0.88rem; margin-bottom: 0.6rem; }
    .md ul, .md ol { padding-left: 1.2rem; margin-bottom: 0.6rem; }
    .md li { font-size: 0.88rem; margin-bottom: 0.15rem; }
    .md strong { color: #fff; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 0.75rem 0; }
    .md em { color: var(--muted); font-size: 0.8rem; }

    /* ── X preview ── */
    .x-label { font-size: 0.72rem; color: var(--muted); margin-top: 1rem; margin-bottom: 0.35rem; }
    .x-box {
      background: #000;
      border: 1px solid #2f3336;
      border-radius: 12px;
      padding: 1rem;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── history list ── */
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      gap: 0.5rem;
    }
    .history-item:last-child { border-bottom: none; }
    .history-item:hover .h-date { color: var(--accent); }
    .h-date { font-size: 0.85rem; }
    .h-arrow { color: var(--muted); font-size: 0.8rem; }

    /* ── states ── */
    .loading { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.9rem; }
    .empty   { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.88rem; line-height: 1.8; }

    /* ── footer ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 1rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
    }
    footer a { color: var(--blue); text-decoration: none; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>📊 AI Capital</h1>
    <p>AI投資法人シミュレーション — 活動記録</p>
  </div>
  <span class="badge">🤖 AIエージェント自動生成</span>
</header>

<main>

  <p class="section-label">エージェント構成</p>
  <div class="agents">
    <span class="agent">📊 マーケット分析部</span>
    <span class="agent">💼 ポートフォリオ管理部</span>
    <span class="agent">⚠️ リスク管理部</span>
    <span class="agent">🔴 反対意見部</span>
    <span class="agent">🔍 監査部</span>
  </div>

  <p class="section-label">最新レポート</p>
  <div id="latest"><div class="loading">読み込み中…</div></div>

  <p class="section-label">レポート履歴</p>
  <div class="card" id="history"><div class="loading">読み込み中…</div></div>

</main>

<footer>
  このサイトはAIエージェントの活動記録です。投資判断は行いません。<br>
  <a href="https://github.com/libtech1359-oss/ai-corp-" target="_blank">GitHub</a>
</footer>

<script>
const REPO = 'libtech1359-oss/ai-corp-';
const RAW  = `https://raw.githubusercontent.com/${REPO}/main`;
const API  = `https://api.github.com/repos/${REPO}/contents`;
const TYPE_LABEL = { morning: '朝', close: '引け後', weekly: '週次' };

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function get(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  return r;
}

async function listReports(type) {
  try {
    const files = await (await get(`${API}/reports/${type}/public`)).json();
    return files
      .filter(f => f.name.endsWith('_note.md'))
      .map(f => ({
        date:     f.name.replace('_note.md', ''),
        type,
        notePath: `${RAW}/reports/${type}/public/${f.name}`,
        xPath:    `${RAW}/reports/${type}/public/${f.name.replace('_note.md', '_x.txt')}`,
      }))
      .sort((a, b) => b.date.localeCompare(a.date));
  } catch { return []; }
}

function tagHtml(type) {
  const label = TYPE_LABEL[type] || type;
  return `<span class="tag ${type}">${label}</span>`;
}

async function renderReport(r) {
  let note = '', x = '';
  try { note = await (await get(r.notePath)).text(); } catch {}
  try { x    = await (await get(r.xPath)).text();    } catch {}

  return `
    <div class="card">
      <div class="card-meta">${tagHtml(r.type)}<span class="card-date">${r.date}</span></div>
      <div class="md">${marked.parse(note || '_レポートを読み込めませんでした_')}</div>
      ${x ? `<p class="x-label">🐦 X投稿プレビュー</p><div class="x-box">${escapeHtml(x)}</div>` : ''}
    </div>`;
}

async function showReport(r) {
  document.getElementById('latest').innerHTML = '<div class="loading">読み込み中…</div>';
  document.getElementById('latest').innerHTML = await renderReport(r);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderHistory(reports) {
  const el = document.getElementById('history');
  if (!reports.length) { el.innerHTML = '<div class="empty">まだレポートはありません</div>'; return; }
  el.innerHTML = reports.map((r, i) => `
    <div class="history-item" data-i="${i}">
      <span class="h-date">${r.date} &nbsp; ${tagHtml(r.type)}</span>
      <span class="h-arrow">→</span>
    </div>`).join('');
  el.querySelectorAll('.history-item').forEach(el => {
    el.addEventListener('click', () => showReport(reports[+el.dataset.i]));
  });
}

async function init() {
  const [morning, close, weekly] = await Promise.all([
    listReports('morning'), listReports('close'), listReports('weekly'),
  ]);
  const all = [...morning, ...close, ...weekly]
    .sort((a, b) => b.date.localeCompare(a.date));

  if (!all.length) {
    document.getElementById('latest').innerHTML =
      `<div class="empty">AIエージェントが毎朝レポートを生成します。<br>最初のレポートをお待ちください。<br><br>🌅 毎日 07:00 JST 自動生成</div>`;
    document.getElementById('history').innerHTML =
      `<div class="empty">レポートはまだありません</div>`;
    return;
  }

  document.getElementById('latest').innerHTML = await renderReport(all[0]);
  renderHistory(all.slice(1));
}

init();
</script>
</body>
</html>
